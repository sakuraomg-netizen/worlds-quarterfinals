/* Portrait resources are separate from the competition data and BP heuristics.
 * Never represent a network-backed starter as a fully bundled offline file.
 * A complete resource pack can be embedded by the browser exporter or build.py.

const PortraitAssets = (() => {
  'use strict';
  const ids = DraftChampions.list.map(c => c.id);
  const allowed = new Set(ids);
  const KEY = 'worlds2026_champion_portraits_v1';
  const VERSION = '16.20.1';
  const assets = Object.create(null);
  const embedded = Object.create(null);
  const failed = new Set();
  let running = false, finished = 0, storageOK = true;
  function validData(s) {
    return typeof s === 'string' && s.length < 220000 && /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
  }
  function merge(raw, target = assets) {
    if (!raw || typeof raw !== 'object') return;
    for (const id of ids) if (validData(raw[id])) target[id] = raw[id];
  }
  try { merge(JSON.parse(document.getElementById('portrait-assets').textContent).assets, embedded); } catch (_) {}
  try { merge(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (_) { storageOK = false; }
  merge(embedded);
  const sources = id => allowed.has(id) ? [
    `https://ddragon.leagueoflegends.com/cdn/${VERSION}/img/champion/${id}.png`,
    `https://ddragon.leagueoflegends.com/cdn/16.21.1/img/champion/${id}.png`
  ] : [];
  function count() { return ids.filter(id => assets[id]).length; }
  function info() {
    const available = count();
    return {available, total:ids.length, embedded:Object.keys(embedded).length,
      complete:available===ids.length, running, failed:failed.size, finished, storageOK, version:VERSION};
  }
  function emit() { document.dispatchEvent(new CustomEvent('portrait-assets-change', {detail:info()})); }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(assets)); storageOK = true; }
    catch (_) { storageOK = false; }
  }
  function source(id) { return assets[id] || sources(id)[0] || ''; }
  // Only fetch portraits that are visible in the current viewport or scrolled grid.
  // This avoids firing 173 network requests on a mobile BP screen.
  const visibleObserver = typeof IntersectionObserver !== 'undefined'
    ? new IntersectionObserver(entries => {
        for (const entry of entries) if (entry.isIntersecting) {
          const img=entry.target;
          visibleObserver.unobserve(img);
          if (!img.getAttribute('src')) img.src=source(img.dataset.portrait);
        }
      }, {rootMargin:'70px'}) : null;

    document.querySelectorAll('img[data-portrait]:not([src])').forEach(img => {
      if(visibleObserver) visibleObserver.observe(img);

      return;

    const next=Number(img.dataset.attempt || 0)+1;
    const urls=sources(id);
    if (next < urls.length) { img.dataset.attempt=String(next); img.src=urls[next]; }
    else {
      img.hidden=true; img.parentElement.classList.add('portrait-missing');
      img.parentElement.title='头像尚未下载成功；请检查网络后重试。BP仍可使用。';
    }

  async function compress(blob) {
    if (!blob || blob.size > 1500000 || !/^image\/(png|jpeg|webp)/.test(blob.type)) throw Error('不支持的图片资源');

    if (count()!==ids.length) throw Error(`头像尚未齐全（${count()}/${ids.length}），不能导出为完整离线版。`);
    const html=document.documentElement.cloneNode(true);

    html.querySelector('#navigation').replaceChildren();

    <section class="lock-panel">${lockHTML()}</section>
    <div class="bp-analysis" id="bp-analysis">${analysisHTML()}</div>
    <section class="panel section-gap">${title(`G${gi()+1} · 本局笔记`,'<span class="pill">独立保存</span>')}<label class="sr-only" for="game-note">本局BP笔记</label><textarea id="game-note" maxlength="12000" placeholder="记录关键反制位、资源重心、选手熟练度与尚未纳入模型的判断……">${esc(g.note)}</textarea><p class="hint">位置自动分配仅使用英雄常见位置，无法确定则留空供你手动指定；调整位置不改变已选英雄。候选库用于模拟，不等于官方赛事可用名单。赛事禁用名单尚未接入；位置与画像为作者规则。<button class="text-btn" data-goto="sources">查看出处与边界 ↗</button></p></section>`+foot();}
  function version(){return head('版本分析','官方改动与阵容解读分开显示；加强或削弱不直接换算成胜率。','PATCH 26.20 / META ANALYSIS')+
    `<div class="version-intro"><section><span>01 / 上路</span><h2>盲选成本与边线职责</h2><p>奎桑提削弱、上路传送调整。选人时同时看抗压、边线与正面职责，不把“选战士”当作版本答案。</p>${ref('patch20','26.20公告 ↗')} · ${ref('patch19','26.19公告 ↗')}</section><section><span>02 / 中野</span><h2>输出位增加，职责要补齐</h2><p>千珏、莉莉娅获得加强。转向输出型打野时，开团、承伤与保护是否由其他位置补齐，是BP要检查的问题。</p>${ref('patch20','26.20公告 ↗')}</section><section><span>03 / 下路</span><h2>线权与发育都需要条件</h2><p>寒冰削弱、卢锡安加强，不等于所有后期阵容失效。先看前期代价与输出环境，再谈版本适配。</p>${ref('patch20','26.20公告 ↗')}</section></div>`+
    notice('下方数值摘自版本公告；上方战术含义属于分析推断。本页不是英雄强度榜，也没有完整逐场BP统计。')+
    `<div class="section-title"><h2>关键改动</h2><small>部分条目 · 26.20与26.19联动</small></div><div class="tabs-inline">${['全部','上路','打野','下路','系统'].map(x=>`<button class="chip ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="patch-grid">${D.patches.filter(p=>state.filter==='全部'||p.role===state.filter).map(p=>`<article class="patch-card"><div class="patch-head"><div class="patch-name"><span class="role-icon">${p.role.slice(0,1)}</span><h3>${p.champ}</h3></div><span class="pill ${p.tag==='加强'?'green':p.tag==='削弱'?'amber':'blue'}">${p.tag}</span></div><p class="patch-fact">${p.fact}</p><div class="patch-question"><b>BP分析切入点 · 非统计结论</b>${p.question}</div><div class="patch-source"><span>PATCH ${p.patch} · ${p.role}</span>${ref(p.source,'官方公告 ↗')}</div></article>`).join('')}</div>
    <section class="panel section-gap">${title('版本如何进入BP演算')}<div class="readme"><p>BP页目前比较阵容结构，不会因为某英雄在公告中“加强”就自动加胜率。版本强度、选手熟练度与实际对线数据仍未接入，避免把不同证据重复计分。</p><p>当前选中的对阵：${match().a} vs ${match().b}。版本笔记可留在本场或对应小局，不影响其他对阵。</p></div><div class="data-actions"><button class="btn primary" data-goto="bp">回到本场BP ${icon('arrow')}</button></div></section>`+foot();}
  function sources(){return head('每个结论，都有出处','赛果、版本事实、手工规则与计算结果分别标记，不互相冒充。','SOURCES / EVIDENCE & RULES')+
    `<div class="sources-grid"><section class="panel">${title('赛事与版本来源','<span class="pill">静态资料</span>')}${D.sources.map(s=>`<article class="source-item"><div class="source-top"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ${icon('arrow')}</a><span class="pill">${s.type}</span></div><p>${esc(s.scope)}</p></article>`).join('')}<article class="source-item"><div class="source-top"><a href="${C.source}" target="_blank" rel="noopener noreferrer">Riot · 英雄目录 ${icon('arrow')}</a><span class="pill">英雄身份</span></div><p>本地候选库${C.list.length}名英雄；位置、分类和0—3画像是作者规则，不来自官方统计。${C.list.filter(c=>!c.profile).map(c=>c.name).join('、')}画像暂缺，选入阵容时暂停概率输出。</p></article><article class="source-item"><a href="https://developer.riotgames.com/docs/lol#data-dragon" target="_blank" rel="noopener noreferrer">Riot Data Dragon · 英雄头像资源 ${icon('arrow')}</a><p>头像默认显示；此启动版尚未预装全部图片，首次需要联网。成功获取后保存到浏览器，全部齐全即可在BP页导出内嵌头像的离线HTML；离线版不再请求图片服务器。图片版本16.20.1仅用于头像，不改动26.20赛事资料或计算规则，也不代表英雄获准参赛。加载失败明确显示名称占位，不影响禁选。</p></article></section>
    <div class="stack"><section class="panel">${title('事实、规则、推导')}<div class="source-kind"><span class="pill green">事实</span><p>赛程与版本条目有外部原始来源。首页把BO1、BO3、BO5分别列出，不混算战力。</p></div><div class="source-kind"><span class="pill amber">作者规则</span><p>英雄画像与模型系数均未训练、未校准。官方英雄页面不为这些数字背书。</p></div><div class="source-kind"><span class="pill blue">计算</span><p>BP完成后按R01—R06推导本局数值。公式可复算，不代表能准确预测比赛，也不输出系列赛晋级率。</p></div></section>
    <section class="panel">${title('尚未接入')}<div class="missing-list">${['同版本职业赛的历史训练与样本外校准','选手英雄池、熟练度与队伍实力','完整对线克制、装备及符文差异','官方赛事临时禁用英雄名单','参考视频字幕与作者原话'].map(x=>`<div class="missing-item"><span class="missing-name">${x}</span><span>未接入</span></div>`).join('')}</div></section>
    <section class="panel">${title('工作区与导出','<span class="pill">离线可用</span>')}<p class="readme">四场比赛各五局BP、位置和笔记保存在此浏览器。JSON可备份恢复；报告保留每局阵容、计算规则与出处。</p><div class="data-actions"><button class="btn primary" id="export-json">${icon('download')} 导出JSON</button><button class="btn" id="export-md">导出报告</button><button class="btn" id="import-json">${icon('upload')} 导入JSON</button></div>${state.archivedV1?'<p class="hint">已保留旧版工作区归档；原评分与单局概率不会进入新BP结果。</p>':''}<div class="divider"></div><button class="btn small ghost danger" id="reset-all">清空个人工作区</button><p class="hint">不同设备不会自动同步。下载后用Chrome或Edge打开；浏览器清理缓存前请导出备份。</p></section></div></div>
    <section class="panel section-gap" id="rules">${title('BP演算的完整规则','<span class="pill amber">非统计模型</span>')}<p class="readme">这些规则是本版实现的一部分，来源为作者手工设计。它们不是从瑞士轮胜率或市场赔率反推的，也没有用BO1、BO3样本冒充BO5模型。</p><div class="rule-grid">${M.RULES.map(r=>`<article class="rule-card" id="rule-${r.id}"><span>${r.id}</span><h3>${r.name}</h3><p>${r.text}</p></article>`).join('')}</div><div class="model-formula">p(A) = 1 / (1 + exp(−z))<br>p(B) = 1 − p(A)<br>默认队伍先验：相同执行能力；未加入球队强弱或选边修正。</div><p class="hint">只在十人阵容完整、位置齐全、前局BP完成且不存在跨局冲突时计算。未设统计置信区间；显示整数百分比不意味着精确到1%。</p></section>
    <section class="panel section-gap">${title('参考视频笔记','<span class="pill amber">未取得字幕</span>')}<p class="subtext">保留原视频与本场笔记，不把未知内容归给作者。<a href="${D.videoUrl}" target="_blank" rel="noopener noreferrer">打开参考视频 ↗</a></p><label class="field-label" for="video-notes">${match().a} vs ${match().b} · 时间点 / 原话 / 你的理解</label><textarea id="video-notes" data-note="videoNotes" maxlength="12000" placeholder="填写你核对过的观点与时间点……">${esc(ms().videoNotes)}</textarea></section>
    <p class="legal-note">八强分析工作台不受Riot Games认可，不代表Riot Games或其相关人员的观点。League of Legends及相关资产属于Riot Games。仅供个人赛事分析，不提供投注或下注功能。</p>`+foot();}
  function render(){
    $('navigation').innerHTML=tabs.map(([key,ico,name,n])=>`<button class="${state.tab===key?'active':''}" data-goto="${key}" ${state.tab===key?'aria-current="page"':''} title="${name}">${icon(ico)}<span class="nav-text">${name}</span><span class="tiny">${n}</span></button>`).join('');
    $('crumb').textContent=tabs.find(t=>t[0]===state.tab)[2];$('timezone').value=state.tz;$('export-top').innerHTML=icon('download')+'导出分析';
    $('main').innerHTML=({overview,bp,version,sources}[state.tab])();
    $('save-state').textContent=storageOK?'已保存在此浏览器':'仅本次会话 · 请导出';
    if(ui.sourceFocus&&state.tab==='sources'){const target=$(ui.sourceFocus);if(target){target.classList.add('rule-highlight');target.scrollIntoView({block:'center'});}ui.sourceFocus=null;}
  }
  function go(tab,focus=null){if(!tabs.some(t=>t[0]===tab))return;state.tab=tab;ui.sourceFocus=focus;save();render();if(!focus)window.scrollTo({top:0,behavior:'instant'});}
  function afterChange(){save();render();}
  function choose(id){const index=currentStep();if(index<0){toast('请先点击一个BP槽位');return;}try{const reason=M.invalidReason(ms(),gi(),index,id);if(reason)throw Error(reason);remember();M.assign(ms(),gi(),index,id);const next=game().actions.findIndex((v,i)=>i>index&&v===null);ui.step=next>=0?next:null;ui.search='';afterChange();}catch(e){toast(e.message);}}
  function bindClicks(e){const el=e.target.closest('button');if(!el||el.disabled)return;
    if(el.dataset.goto){go(el.dataset.goto,el.dataset.sourceFocus||null);return;}
    if(el.dataset.match){state.selected=el.dataset.match;resetUI();afterChange();return;}
    if(el.dataset.game!==undefined){ms().game=+el.dataset.game;resetUI();afterChange();return;}
    if(el.dataset.step!==undefined){ui.step=+el.dataset.step;ui.search='';render();return;}
    if(el.dataset.champ){choose(el.dataset.champ);return;}
    if(el.dataset.poolRole!==undefined){ui.role=el.dataset.poolRole;render();return;}
    if(el.dataset.filter){state.filter=el.dataset.filter;afterChange();return;}
    switch(el.id){
      case 'skip-ban':choose('__skip__');break;
      case 'clear-slot':remember();M.clear(game(),currentStep());afterChange();break;
      case 'undo-bp':{const stack=ui.undo[undoKey()];if(stack?.length){ms().games[gi()]=stack.pop();ui.step=null;afterChange();}break;}
      case 'reset-game':if(confirm(`清空${team('a')} vs ${team('b')}的G${gi()+1}禁选、位置和本局笔记？后局保留，并重新检查冲突。`)){remember();ms().games[gi()]=M.defaultGame();resetUI();afterChange();}break;
      case 'export-json':exportJSON();break;
      case 'export-md':exportMarkdown();break;
      case 'import-json':$('import-file').click();break;
      case 'reset-all':if(confirm('清空四场比赛的全部BP与笔记？建议先导出JSON备份。')){state=defaults();resetUI();ui.undo={};afterChange();toast('个人工作区已清空，内置资料未变。');}break;
    }
  }
  $('navigation').addEventListener('click',bindClicks);$('main').addEventListener('click',bindClicks);
  $('main').addEventListener('input',e=>{const el=e.target;if(el.id==='champ-search'){ui.search=el.value;$('champ-grid').innerHTML=poolItems();}else if(el.dataset.note){ms()[el.dataset.note]=el.value;save();}else if(el.id==='game-note'){game().note=el.value;save();}});
  $('main').addEventListener('change',e=>{const el=e.target;
    if(el.id==='first-pick'){remember();M.changeFirst(game(),el.value);ui.step=null;afterChange();}
    else if(el.id==='blue-side'){remember();game().blue=el.value;afterChange();}
    else if(el.dataset.roleSide){remember();M.changeRole(game(),el.dataset.roleSide,+el.dataset.roleSlot,el.value===''?null:+el.value);afterChange();}
    else if(el.id==='available-only'){ui.available=el.checked;$('champ-grid').innerHTML=poolItems();}
  });
  function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  function exportJSON(){download('worlds_quarterfinals_bp_workspace.json',JSON.stringify({app:'worlds-quarterfinals-workspace',exportVersion:2,exportedAt:new Date().toISOString(),snapshotDate:D.snapshot,workspace:state,model:{version:C.version,calibrated:false,rules:M.RULES},sourceSnapshot:{matches:D.matches,swiss:D.swiss,patch:D.patch,sources:D.sources}},null,2),'application/json;charset=utf-8');toast('已导出四场比赛、全部逐局BP与笔记。');}
  function exportMarkdown(){const lines=['# 八强分析工作台','','数据快照：2026-11-01；静态，不自动更新。',`导出：${new Date().toISOString()}`,'','BP概率是手工规则估算，未训练、未校准，不是经验证的真实胜率。BO1/BO3/BO5不混算。',''];
    for(const m of D.matches){const s=state.matches[m.id];lines.push(`## ${m.a} vs ${m.b}`,`赛制BO5；开赛UTC：${m.start}`,'',s.notes||'未填写系列赛笔记。','');for(const [i,g] of s.games.entries()){const r=M.analyze(s,i);lines.push(`### G${i+1}`,`先选：${m[g.firstPick]}；地图蓝色方：${m[g.blue]}。`);for(const side of ['a','b']){lines.push(`- ${m[side]}选用：${M.entries(g,'pick',side).map(p=>`${p.id?C.byId[p.id]?.name||p.id:'未选'}（${p.role===null?'位置未定':C.roles[p.role]}）`).join('、')}`,`- ${m[side]}禁用：${M.entries(g,'ban',side).map(p=>p.id==='__skip__'?'空Ban':C.byId[p.id]?.name||'未禁').join('、')}`);}lines.push(r.ready?`规则推导概率（未校准）：${m.a} ${pct(r.pA)} / ${m.b} ${pct(r.pB)}；z=${r.z.toFixed(6)}。`:`未输出概率：${r.reasons.join('；')}。`);if(r.ready)lines.push(...r.contributions.map(x=>`- ${x.name}：${x.value.toFixed(6)}；${x.rule}`));lines.push('',g.note||'未填写本局笔记。','');}lines.push('### 视频笔记（非自动转录）',s.videoNotes||'未填写。','');}
    lines.push('## 计算规则与边界',...M.RULES.flatMap(x=>[`### ${x.id} ${x.name}`,x.text,'']),'## 外部来源',...D.sources.map(s=>`- ${s.name}：${s.url}；${s.scope}`),`- 英雄目录：${C.source}`,`- 参考视频（未读取）：${D.videoUrl}`);download('worlds_quarterfinals_bp_report.md',lines.join('\n'),'text/markdown;charset=utf-8');toast('逐局BP分析报告已导出。');}
  $('timezone').addEventListener('change',e=>{state.tz=e.target.value;afterChange();});$('export-top').addEventListener('click',exportMarkdown);
  $('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2_000_000)throw Error('文件超过2MB');const raw=JSON.parse(await file.text());if(raw.app!=='worlds-quarterfinals-workspace'||![1,2].includes(raw.exportVersion))throw Error('不是本工具的备份文件');const candidate=validate(raw.workspace);if(!confirm('导入将替换当前四场比赛的BP和笔记，内置资料不变。继续？'))return;state=candidate;resetUI();ui.undo={};afterChange();toast(raw.exportVersion===1?'旧版笔记已迁移，旧评分与公式参数仅归档。':'全部BP与笔记已恢复。');}catch(err){toast('导入失败：'+err.message);}finally{e.target.value='';}});
  window.WorldsDiagnostics={getState:()=>clone(state),validate,analyze:()=>M.analyze(ms(),gi()),model:M,champions:C,version:3,portraitAssets:PortraitAssets.info};
  document.addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.id==='retry-portraits')PortraitAssets.prepare();
    if(button.id==='export-offline')try{PortraitAssets.exportOffline();toast('已导出头像内嵌的离线网页；BP记录请另用JSON备份。');}catch(err){toast(err.message);}
  });
  save();render();if(initialMessage)toast(initialMessage);
  // Online portraits load lazily. Bulk download is opt-in to avoid hundreds of
  // simultaneous mobile requests and unexpected UI redraws during BP.
  const portraitObserver=new MutationObserver(()=>PortraitAssets.observe());
  portraitObserver.observe($('main'),{childList:true,subtree:true});
  PortraitAssets.observe();
})();

</script>
